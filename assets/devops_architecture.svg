<svg xmlns="http://www.w3.org/2000/svg" class="atlas" viewBox="0 0 1440 1220" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">GCP Cloud DevOps Platform</title>
<desc id="diagram-description">GitHub Actions builds Docker images and Helm releases. Terraform provisions the GCP Kubernetes infrastructure. Managed Prometheus collects metrics; Monarch supports dashboards, while rule evaluation feeds Alertmanager, Slack runbooks and incident resolution.</desc>
<style>.atlas {--atlas-bg:#181b20;--atlas-title:#eeebe5;--atlas-body:#cbd1da;--atlas-note:#b7c2cf;--atlas-rule:#505e6e;--atlas-panel:#252e39;--atlas-outline:#71869e;--atlas-paper:#293847;--atlas-paper-stroke:#8ba5bd;--atlas-fold:#3c5064;--atlas-gate:#38312b;--atlas-cluster:#22383c;--atlas-cluster-well:#192c32;--atlas-pod:#2a4a48;--atlas-pod-stroke:#78bfb7;--atlas-pod-mark:#a1d7ce;--atlas-edge:#8ba5bd;--atlas-signal-edge:#bba080;--atlas-data:#81d4df;--atlas-signal:#f0a1ae;--atlas-tint:#173741}
@media(prefers-color-scheme:light) {:root:not([data-theme="dark"]) .atlas, :root.atlas:not([data-theme="dark"]) {--atlas-bg:#e7e1d5;--atlas-title:#252b33;--atlas-body:#354655;--atlas-note:#465562;--atlas-rule:#9d9b94;--atlas-panel:#d9d7cf;--atlas-outline:#687a86;--atlas-paper:#d2dbe0;--atlas-paper-stroke:#5f788d;--atlas-fold:#bbcbd6;--atlas-gate:#dfd2b9;--atlas-cluster:#cddbd5;--atlas-cluster-well:#dce4dd;--atlas-pod:#b9d0c6;--atlas-pod-stroke:#3f756c;--atlas-pod-mark:#305e55;--atlas-edge:#55758b;--atlas-signal-edge:#85653e;--atlas-data:#17616e;--atlas-signal:#8b3d51;--atlas-tint:#c7dbdc}}
:root[data-theme="light"] .atlas, :root.atlas[data-theme="light"] {--atlas-bg:#e7e1d5;--atlas-title:#252b33;--atlas-body:#354655;--atlas-note:#465562;--atlas-rule:#9d9b94;--atlas-panel:#d9d7cf;--atlas-outline:#687a86;--atlas-paper:#d2dbe0;--atlas-paper-stroke:#5f788d;--atlas-fold:#bbcbd6;--atlas-gate:#dfd2b9;--atlas-cluster:#cddbd5;--atlas-cluster-well:#dce4dd;--atlas-pod:#b9d0c6;--atlas-pod-stroke:#3f756c;--atlas-pod-mark:#305e55;--atlas-edge:#55758b;--atlas-signal-edge:#85653e;--atlas-data:#17616e;--atlas-signal:#8b3d51;--atlas-tint:#c7dbdc}

.atlas { background:var(--atlas-bg); font-family:Arial,Helvetica,sans-serif; }
.atlas-canvas { fill:var(--atlas-bg); }
.atlas text { font-family:Arial,Helvetica,sans-serif; }
.atlas-title { font-size:20px; font-weight:600; fill:var(--atlas-title); }
.atlas-body { font-size:18px; fill:var(--atlas-body); }
.atlas-phase { font-size:17px; font-weight:600; fill:var(--atlas-data); }
.atlas-label { font-size:17px; font-weight:600; fill:var(--atlas-title); }
.atlas-note { font-size:16px; fill:var(--atlas-note); }
.atlas-rule { fill:none; stroke:var(--atlas-rule); stroke-width:1; }
.atlas-panel { fill:var(--atlas-panel); stroke:var(--atlas-outline); stroke-width:1.2; }
.atlas-paper { fill:var(--atlas-paper); stroke:var(--atlas-paper-stroke); stroke-width:1.2; }
.atlas-sheet-back { fill:none; stroke:var(--atlas-outline); stroke-width:1; }
.atlas-fold { fill:var(--atlas-fold); stroke:var(--atlas-paper-stroke); stroke-width:1; }
.atlas-paper-line { fill:none; stroke:var(--atlas-paper-stroke); stroke-width:2; }
.atlas-cylinder { fill:var(--atlas-tint); stroke:var(--atlas-data); stroke-width:1.3; }
.atlas-cylinder-top { fill:var(--atlas-tint); stroke:var(--atlas-data); stroke-width:1.3; }
.atlas-cylinder-ring { fill:none; stroke:var(--atlas-data); stroke-width:1; opacity:.55; }
.atlas-gate { fill:var(--atlas-gate); stroke:var(--atlas-signal); stroke-width:1.4; }
.atlas-icon { fill:none; stroke:var(--atlas-data); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.atlas-window-rule { stroke:var(--atlas-rule); stroke-width:1; }
.atlas-cluster { fill:var(--atlas-cluster); stroke:var(--atlas-data); stroke-width:1.5; }
.atlas-pod { fill:var(--atlas-pod); stroke:var(--atlas-pod-stroke); stroke-width:1; }
.atlas-pod-mark { fill:none; stroke:var(--atlas-pod-mark); stroke-width:1.5; }
.atlas-edge { fill:none; stroke:var(--atlas-edge); stroke-width:2; stroke-linejoin:round; }
.atlas-edge.signal { stroke:var(--atlas-signal-edge); }
.atlas-trace { fill:none; stroke:var(--atlas-data); stroke-width:2.8; stroke-dasharray:7 93; stroke-linecap:round; animation:atlas-flow 7s linear infinite; }
.atlas-trace.signal { stroke:var(--atlas-signal); }
.paused .atlas-trace { animation-play-state:paused !important; }
@keyframes atlas-flow { from { stroke-dashoffset:100; } to { stroke-dashoffset:0; } }
@media(prefers-reduced-motion:reduce) { .atlas-trace { animation:none !important; display:none; } }
</style>
