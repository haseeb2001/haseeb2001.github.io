<header class="head"><h1>Healthcare Claims Text-to-SQL Pipeline</h1><p>Schema-grounded SQL generation, separate validity and intent checks, and model fine-tuning</p></header>
<div class="viewport"><svg xmlns="http://www.w3.org/2000/svg" class="atlas" viewBox="0 0 1440 1270" role="img" aria-labelledby="diagram-title diagram-description">
<title id="diagram-title">Healthcare Claims Text-to-SQL Pipeline</title>
<desc id="diagram-description">Natural-language claims questions use BigQuery schema extraction and GPT-4 few-shot prompting to generate SQL. BigQuery dry runs check syntax and schema without execution; GPT-4 separately reviews question alignment and suggests corrections. Validated question–SQL pairs are exported for model fine-tuning. The source reports 97%+ dry-run validity and 200 validated pairs, a deployed davinci-002 model, and GCP Model Garden LLaMA / Code LLaMA LoRA experiments.</desc>
